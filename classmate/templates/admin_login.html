<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin login | classmate</title>
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body class="login-page">
<main class="login-box">
  <a class="logo" href="/">classmate</a>
  <h1>Admin login</h1>
  {% if not configured %}
  <p class="msg err">Admin login is not set up yet. Open <code>app.py</code> and fill in <code>ADMIN_EMAIL</code> and <code>ADMIN_PASSWORD</code> at the top, then restart.</p>
  {% endif %}
  {% if error %}<p class="msg err" role="alert">{{ error }}</p>{% endif %}
  <form method="post" autocomplete="on">
    <label>Email<input type="email" name="email" required autofocus autocomplete="username"></label>
    <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="hint"><a href="/">Back to website</a></p>
</main>
</body>
</html>
